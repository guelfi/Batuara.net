<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutorial do Site da Casa Batuara</title>
<style>
  :root{
    --azul:#1976d2; --azul-esc:#1565c0; --azul-cl:#e3f0fc; --dourado:#ffc107; --dourado-cl:#fff6d6;
    --txt:#212121; --txt2:#555; --bg:#f4f7fb; --card:#fff; --ok:#2e7d32; --ok-cl:#e6f4e7; --erro:#c62828;
    --borda:#d8e1ec; --sombra:0 6px 22px rgba(25,60,110,.12);
  }
  @media (prefers-color-scheme: dark){
    :root{ --txt:#eef2f7; --txt2:#b7c2d0; --bg:#0f1722; --card:#18212e; --azul-cl:#16314f; --dourado-cl:#3a3010;
           --ok-cl:#17301a; --borda:#2b384a; --sombra:0 6px 22px rgba(0,0,0,.4); }
  }
  *{box-sizing:border-box}
  html{font-size:112.5%}               /* letra maior para facilitar a leitura */
  body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55}
  .topo{background:var(--azul);color:#fff;padding:.7rem 1rem;display:flex;align-items:center;gap:.7rem}
  .topo img{height:34px;width:auto;background:#fff;border-radius:8px;padding:3px}
  .topo b{font-size:1rem;line-height:1.2}
  main{max-width:880px;margin:0 auto;padding:1.2rem 1rem 3rem}
  .card{background:var(--card);border-radius:18px;box-shadow:var(--sombra);padding:1.4rem 1.3rem;margin-bottom:1rem}
  h1{font-size:1.55rem;line-height:1.25;margin:.2rem 0 .8rem}
  h2{font-size:1.3rem;line-height:1.3;margin:.2rem 0 .7rem}
  p{margin:.6rem 0}
  .grande{font-size:1.1rem}
  .destaque{background:var(--dourado-cl);border-left:6px solid var(--dourado);padding:.8rem 1rem;border-radius:10px;margin:1rem 0}
  .dica{background:var(--azul-cl);border-left:6px solid var(--azul);padding:.8rem 1rem;border-radius:10px;margin:1rem 0}
  .ok{background:var(--ok-cl);border-left:6px solid var(--ok);padding:.8rem 1rem;border-radius:10px;margin:1rem 0}
  .escolhas{display:grid;gap:.9rem;grid-template-columns:1fr;margin-top:1.1rem}
  @media(min-width:640px){.escolhas{grid-template-columns:1fr 1fr}}
  button{font:inherit;cursor:pointer}
  .opcao{border:3px solid var(--azul);background:var(--card);color:var(--txt);border-radius:18px;padding:1.2rem 1rem;text-align:center;
         display:flex;flex-direction:column;align-items:center;gap:.4rem;min-height:150px;justify-content:center}
  .opcao:hover,.opcao:focus-visible{background:var(--azul-cl)}
  .opcao .ico{font-size:2.6rem;line-height:1}
  .opcao strong{font-size:1.25rem}
  .opcao span.sub{color:var(--txt2);font-size:.95rem}
  .nav{display:flex;gap:.7rem;margin-top:1.2rem;flex-wrap:wrap}
  .btn{border:0;border-radius:14px;padding:.95rem 1.3rem;font-size:1.1rem;font-weight:700;min-height:54px}
  .btn.prim{background:var(--azul);color:#fff;flex:1 1 180px}
  .btn.prim:hover{background:var(--azul-esc)}
  .btn.sec{background:transparent;color:var(--azul);border:2px solid var(--azul);flex:0 1 140px}
  .btn.link{background:none;border:0;color:var(--azul);text-decoration:underline;padding:.5rem;font-weight:600;min-height:44px}
  .progresso{display:flex;gap:6px;margin:.2rem 0 1rem}
  .progresso i{flex:1;height:8px;border-radius:5px;background:var(--borda)}
  .progresso i.on{background:var(--azul)}
  .passo-n{display:inline-block;background:var(--azul);color:#fff;border-radius:999px;padding:.15rem .8rem;font-weight:700;font-size:.95rem}
  .cena{display:flex;justify-content:center;margin:1rem 0 .4rem}
  [hidden]{display:none!important}

  /* ===== desenhos (maquetes) ===== */
  .celular{width:270px;border:10px solid #263238;border-radius:34px;background:#fff;overflow:hidden;position:relative;height:480px;box-shadow:0 10px 26px rgba(0,0,0,.28);color:#212121}
  .celular .barra{background:var(--azul);color:#fff;height:50px;display:flex;align-items:center;padding:0 10px;gap:6px;font-size:.78rem;font-weight:600}
  .celular .barra img{height:22px;background:#fff;border-radius:4px;padding:1px}
  .celular .barra .nome{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hamb{width:36px;height:34px;display:flex;flex-direction:column;justify-content:center;gap:5px;align-items:center;border-radius:8px}
  .hamb i{display:block;width:22px;height:3px;background:#fff;border-radius:2px}
  .celular .corpo{padding:14px 12px;font-size:.78rem;color:#444}
  .celular .corpo h4{margin:.2rem 0 .4rem;font-size:.95rem;color:#1565c0}
  .faixa{height:64px;border-radius:10px;background:linear-gradient(120deg,#42a5f5,#1565c0);margin-bottom:10px}
  .linhas span{display:block;height:8px;border-radius:4px;background:#e3e8ee;margin:7px 0}
  .linhas span:nth-child(2){width:82%}.linhas span:nth-child(3){width:64%}
  .gaveta{position:absolute;top:0;right:0;bottom:0;width:78%;background:#fff;box-shadow:-6px 0 14px rgba(0,0,0,.25);padding:6px 0;overflow:hidden}
  .gaveta .x{text-align:right;padding:2px 12px;font-size:1.3rem;color:#555}
  .gaveta .sub{font-weight:700;font-size:.78rem;padding:2px 16px;color:#777}
  .gaveta .it{padding:7px 16px;font-size:.85rem;border-radius:0}
  .gaveta .it.d{color:var(--azul);font-weight:700}
  .fundo-escuro{position:absolute;inset:0;background:rgba(0,0,0,.45)}
  .alvo{position:relative;outline:3px solid var(--dourado);outline-offset:2px;border-radius:10px;animation:pisca 1.3s infinite}
  .gaveta .it.alvo{background:var(--dourado-cl);outline-offset:-3px}
  @keyframes pisca{0%,100%{box-shadow:0 0 0 0 rgba(255,193,7,.9)}50%{box-shadow:0 0 0 9px rgba(255,193,7,0)}}
  @media (prefers-reduced-motion:reduce){.alvo{animation:none}}
  .tela-form{padding:14px 14px}
  .tela-form .tit{font-weight:700;color:#1565c0;font-size:.95rem;text-align:center;margin:.1rem 0}
  .tela-form .sub2{text-align:center;color:#777;font-size:.75rem;margin-bottom:8px}
  .tabs{display:flex;border:1px solid #cfd8dc;border-radius:8px;overflow:hidden;margin:6px 0 10px;font-size:.72rem}
  .tabs div{flex:1;text-align:center;padding:6px 2px;color:#555}
  .tabs div.sel{background:var(--azul);color:#fff;font-weight:700}
  .campo{border:1px solid #90a4ae;border-radius:6px;padding:7px 8px;font-size:.78rem;color:#37474f;margin:7px 0;background:#fff}
  .campo small{display:block;color:#78909c;font-size:.62rem}
  .botao{background:var(--azul);color:#fff;text-align:center;border-radius:8px;padding:9px 4px;font-weight:700;font-size:.78rem;margin-top:8px}
  .msg-ok{color:#2e7d32;font-size:.68rem;margin:4px 0}
  .zap{background:#e5ddd5;height:100%;padding:12px 10px;font-size:.78rem}
  .zap .topo-zap{background:#075e54;color:#fff;margin:-12px -10px 10px;padding:10px;font-weight:700}
  .bolha{background:#fff;border-radius:0 10px 10px 10px;padding:8px 10px;max-width:92%;box-shadow:0 1px 1px rgba(0,0,0,.15)}
  .bolha b.cod{display:block;font-size:1.5rem;letter-spacing:5px;color:#111;margin:4px 0;text-align:center}
  .perfil-tela{padding:12px}
  .perfil-tela .tit{font-weight:700;font-size:1rem;color:#212121}
  .caixa{border:1px solid #cfd8dc;border-radius:8px;padding:8px;margin-top:8px;font-size:.72rem;color:#546e7a}

  /* navegador (versão computador) */
  .navegador{width:100%;max-width:640px;border:2px solid #90a4ae;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.2);color:#212121}
  .navegador .abas{background:#dfe5ea;padding:6px 10px;font-size:.7rem;display:flex;gap:6px;align-items:center}
  .navegador .url{background:#fff;border-radius:999px;padding:3px 12px;flex:1;color:#37474f;font-size:.75rem}
  .navegador .site{min-height:250px}
  .menu-pc{background:var(--azul);color:#fff;padding:7px 8px 6px;font-size:.62rem}
  .menu-pc .l1{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.72rem;margin-bottom:5px}
  .menu-pc .l1 img{height:20px;background:#fff;border-radius:4px;padding:1px}
  .menu-pc .itens{display:flex;flex-wrap:wrap;gap:3px 10px;justify-content:center}
  .menu-pc .itens span{padding:2px 5px;border-radius:5px}
  .menu-pc .itens span.alvo{background:rgba(255,255,255,.18);outline-color:var(--dourado)}
  .navegador .conteudo{padding:12px 16px;font-size:.75rem;color:#444}
  .navegador .conteudo .faixa{height:90px}
  .navegador.login .site{display:flex;justify-content:center;padding:14px}
  .navegador.login .tela-form{width:250px;border:1px solid #e0e6ec;border-radius:12px}
  .navegador.zapweb{max-width:340px}
  .legenda{text-align:center;color:var(--txt2);font-size:.95rem;margin:.2rem 0 1rem}

  .faq details{border:1px solid var(--borda);border-radius:12px;padding:.7rem 1rem;margin:.6rem 0;background:var(--card)}
  .faq summary{font-weight:700;cursor:pointer;min-height:36px;display:flex;align-items:center}
  .rodape{text-align:center;color:var(--txt2);font-size:.9rem;margin-top:1.5rem}
  ol.lista{padding-left:1.3rem} ol.lista li{margin:.5rem 0}
</style>
</head>

  function gaveta(alvo){

    var h='<div class="fundo-escuro"></div><div class="gaveta"><div class="x">✕</div><div class="sub">Público</div>';
    itens.forEach(function(t){ h+='<div class="it'+(t===alvo?' alvo d':'')+'">'+t+'</div>'; });
    return h+'</div>';
  }
  function telaLogin(estado){
    var campos, rotulo;
    if(estado==='tel'){
      campos='<div class="campo alvo"><small>Celular com DDD</small>(11) 9XXXX-XXXX</div>'+
             '<div class="campo"><small>Código recebido</small>&nbsp;</div>';
      rotulo='Receber código no WhatsApp';
    } else {
      campos='<div class="campo"><small>Celular com DDD</small>(11) 9XXXX-XXXX</div><div class="msg-ok">Código enviado! Verifique seu WhatsApp.</div>'+
             '<div class="campo alvo"><small>Código recebido</small>1 2 3 4 5 6</div>';
      rotulo='Entrar com código';
    }
    return '<div class="tela-form"><div class="tit">Casa de Caridade Batuara</div><div class="sub2">Acesso Batuara.net</div>'+
           '<div class="tabs"><div>Administração</div><div class="sel">Filho da Casa</div></div>'+campos+
           '<div class="botao">'+rotulo+'</div></div>';
  }
  function whats(){
    return '<div class="zap"><div class="topo-zap">WhatsApp &nbsp;›&nbsp; Casa Batuara</div>'+
           '<div class="bolha"><b class="cod alvo" style="display:block">123456</b>é o seu código de verificação.<br><small>Por segurança, não compartilhe este código.</small></div></div>';
  }
  function perfil(menuAberto){
    var base='<div class="barra"><img alt="" src="'+LOGO+'"><div class="nome">Casa Batuara</div></div>'+
      '<div class="perfil-tela"><div class="tit">Meu Cadastro</div>'+
      '<div class="caixa">Atualize seus dados pessoais e endereço.</div>'+
      '<div class="caixa">Dados pessoais<br>Endereço<br>Minha contribuição</div></div>';
    return base;
  }
  function gavetaLogado(alvo){
    var h='<div class="fundo-escuro"></div><div class="gaveta"><div class="x">✕</div><div class="sub">Público</div>';
    ['Início','Nossa História','Calendário','Doações','Contato'].forEach(function(t){h+='<div class="it">'+t+'</div>';});
    h+='<div class="it">…</div><div class="sub" style="margin-top:6px;border-top:1px solid #ddd;padding-top:6px">Área autenticada</div>';
    ['Perfil','Sair'].forEach(function(t){h+='<div class="it'+(t===alvo?' alvo d':'')+'">'+t+'</div>';});
    return h+'</div>';
  }

  /* navegador (computador) */
  function pcMenu(alvo, logado){
    var it=['Início','Nossa História','Nossa Missão','Calendário','Eventos e Festas','Doações','Contato','Localização'];
    if(!logado) it.push('Filhos'); else it=it.concat(['Perfil','Sair']);
    var h='<div class="menu-pc"><div class="l1"><img alt="" src="'+LOGO+'">Casa de Caridade Caboclo Batuara</div><div class="itens">';
    it.forEach(function(t){h+='<span class="'+(t===alvo?'alvo':'')+'">'+t+'</span>';});
    return h+'</div></div>';
  }
  function navegador(url, inner, cls){
    return '<div class="cena"><div class="navegador '+(cls||'')+'" role="img" aria-label="Desenho de um navegador no computador"><div class="abas">● ● ● <div class="url">'+url+'</div></div><div class="site">'+inner+'</div></div></div>';
  }
  function siteCorpoPC(){ return '<div class="conteudo"><div class="faixa"></div><div class="linhas"><span></span><span></span><span></span></div></div>'; }

  /* ---------- roteiros ---------- */
  var comum = {
    abrir: {
      t:'Abra o site da Casa',
      txt:'<p class="grande">Abra o navegador do aparelho (<b>Chrome</b>, <b>Safari</b> ou o que você usa) e digite na barra de cima o endereço:</p><div class="destaque grande" style="text-align:center"><b style="font-size:1.35rem;word-break:break-all">'+SITE+'</b></div><p>Depois toque em <b>Ir</b> (ou aperte <b>Enter</b> no computador).</p>'
    }
  };

  var MOBILE = [
    { t:'Abra o site da Casa', html:function(){return comum.abrir.txt + celular(barraCel(false)+corpoSite()) + '<p class="legenda">Assim o site aparece no celular. Repare nas <b>3 listrinhas</b> no canto de cima, à direita.</p>';},
      dica:'Dica: guarde o site na tela inicial do celular. No Chrome: toque nos <b>3 pontinhos</b> › <b>Adicionar à tela inicial</b>. Assim você abre com um toque, como um aplicativo.' },
    { t:'Encontre o botão do menu (as 3 listrinhas)', html:function(){return '<p class="grande">No celular, o menu do site fica escondido. Para abrir, toque no botão com <b>3 listrinhas</b> (chamado de <b>menu hambúrguer</b>), no <b>canto superior direito</b> da tela.</p>'+celular(barraCel(true)+corpoSite())+'<p class="legenda">O botão que está piscando em amarelo é o menu.</p>';} },
    { t:'Toque no menu e veja as opções', html:function(){return '<p class="grande">Ao tocar, o menu abre pela direita com a lista de opções do site: <b>Início</b>, <b>Nossa História</b>, <b>Calendário</b>, <b>Doações</b>, <b>Contato</b> e outras. Toque em qualquer uma para ir até ela.</p>'+celular(barraCel(false)+corpoSite()+gaveta('Filhos'))+'<p class="legenda">Para fechar o menu sem escolher nada, toque no <b>✕</b> ou fora da lista.</p>';},
      dica:'Cada opção leva você para um trecho do mesmo site. Para voltar ao começo, toque na <b>logo da Casa</b> no topo.' },
    { t:'Toque em “Filhos” (a última opção)', html:function(){return '<p class="grande">A opção <b>Filhos</b> fica no <b>final da lista</b>. É por ela que você entra na sua área, usando o seu número de celular.</p>'+celular(barraCel(false)+corpoSite()+gaveta('Filhos'))+'<p class="legenda">Toque em <b>Filhos</b>.</p>';} },
    { t:'Digite o seu número de celular', html:function(){return '<p class="grande">Abre a tela <b>Acesso Batuara.net</b> já na aba <b>Filho da Casa</b>. No campo <b>Celular com DDD</b>, digite o <b>mesmo número de WhatsApp</b> que a Casa tem no seu cadastro. Exemplo: <b>(11) 9XXXX-XXXX</b>.</p>'+celular(telaLogin('tel'))+'<p class="legenda">Depois toque em <b>Receber código no WhatsApp</b>.</p>';},
      aviso:'Não precisa de senha. Cada vez que entrar, você recebe um código novo no WhatsApp.' },
    { t:'Abra o WhatsApp e veja o código', html:function(){return '<p class="grande">Em poucos segundos chega uma mensagem no <b>seu WhatsApp</b>, vinda do número oficial da Casa, com um <b>código de 6 números</b> (o desenho abaixo é só um exemplo).</p>'+celular(whats())+'<p class="legenda">Guarde o código na cabeça (ou deixe o WhatsApp aberto) e <b>volte para o site</b>.</p>';},
      aviso:'O código vale por <b>10 minutos</b> e serve só para você. <b>Nunca passe o código para ninguém.</b>' },
    { t:'Digite o código e entre', html:function(){return '<p class="grande">De volta ao site, a tela mostra <b>“Código enviado! Verifique seu WhatsApp.”</b> Digite os 6 números no campo <b>Código recebido</b> e toque em <b>Entrar com código</b>.</p>'+celular(telaLogin('tel-ok'))+'<p class="legenda">Se errar, é só digitar de novo. Você tem até 5 tentativas por código.</p>';} },
    { t:'Pronto! Você está na sua área', html:function(){return '<p class="grande">Você entrou! A primeira tela é o <b>Meu Cadastro</b>, onde você confere e atualiza seus dados (endereço, telefone, e-mail) e registra sua contribuição.</p>'+celular(perfil())+'<p class="legenda">As informações religiosas e o status do cadastro são mantidos pela direção da Casa.</p>';} },
    { t:'Como voltar ao site e como sair', html:function(){return '<p class="grande">Agora, quando você abre o menu (as 3 listrinhas) do site, aparece uma parte nova chamada <b>Área autenticada</b>, com <b>Perfil</b> (seus dados) e <b>Sair</b>. Conteúdos exclusivos dos filhos, quando a direção liberar, também aparecem aí.</p>'+celular(barraCel(false)+corpoSite()+gavetaLogado('Sair'))+'<p class="legenda">Ao terminar, toque em <b>Sair</b>, principalmente se o celular for emprestado.</p>';},
      aviso:'Para entrar de novo outro dia, repita: menu › <b>Filhos</b> › número › código.' }
  ];

  var DESK = [
    { t:'Abra o site da Casa', html:function(){return comum.abrir.txt + navegador(SITE, pcMenu(null)+siteCorpoPC()) + '<p class="legenda">No computador o menu aparece <b>aberto, em faixas, no alto da tela</b>. Não existe o botão de listrinhas.</p>';},
      dica:'Dica: salve o site nos favoritos (aperte <b>Ctrl + D</b>) para voltar rápido.' },
    { t:'Conheça o menu do alto da tela', html:function(){return '<p class="grande">As opções ficam lado a lado no alto: <b>Início</b>, <b>Nossa História</b>, <b>Nossa Missão</b>, <b>Calendário</b>, <b>Eventos e Festas</b>, <b>Doações</b>, <b>Contato</b>, <b>Localização</b> e <b>Filhos</b>. Clique em uma para a página descer até aquele assunto.</p>'+navegador(SITE, pcMenu('Calendário')+siteCorpoPC())+'<p class="legenda">O menu acompanha você enquanto a página rola.</p>';} },
    { t:'Clique em “Filhos”', html:function(){return '<p class="grande">A opção <b>Filhos</b> é a <b>última do menu</b>, à direita. É a porta de entrada da sua área.</p>'+navegador(SITE, pcMenu('Filhos')+siteCorpoPC())+'<p class="legenda">Clique em <b>Filhos</b>.</p>';} },
    { t:'Digite o seu número de celular', html:function(){return '<p class="grande">Abre a tela <b>Acesso Batuara.net</b> na aba <b>Filho da Casa</b>. Digite, em <b>Celular com DDD</b>, o <b>mesmo número de WhatsApp</b> que a Casa tem no seu cadastro, e clique em <b>Receber código no WhatsApp</b>.</p>'+navegador(SITE+'/admin/login',telaLogin('tel'),'login')+'<p class="legenda">Não precisa de senha.</p>';},
      aviso:'O código chega no <b>WhatsApp do celular</b> cadastrado. Deixe o celular por perto.' },
    { t:'Pegue o código no WhatsApp', html:function(){return '<p class="grande">Pegue o celular e abra o WhatsApp. Chega uma mensagem do número oficial da Casa com um <b>código de 6 números</b>.</p>'+celular(whats())+'<p class="legenda">Se você usa o <b>WhatsApp Web</b> no computador, a mensagem também aparece lá.</p>';},
      aviso:'O código vale por <b>10 minutos</b> e é só seu. <b>Nunca passe o código para ninguém.</b>' },
    { t:'Digite o código e entre', html:function(){return '<p class="grande">Volte para o computador. Digite os 6 números em <b>Código recebido</b> e clique em <b>Entrar com código</b>.</p>'+navegador(SITE+'/admin/login',telaLogin('tel-ok'),'login')+'<p class="legenda">Você tem até 5 tentativas por código.</p>';} },
    { t:'Pronto! Você está na sua área', html:function(){return '<p class="grande">Você entrou! A primeira tela é o <b>Meu Cadastro</b>: confira e atualize seus dados e registre sua contribuição.</p>'+navegador(SITE+'/admin/profile','<div style="padding:12px 16px;font-size:.8rem"><b style="font-size:1rem">Meu Cadastro</b><div class="caixa">Atualize seus dados pessoais e endereço.</div><div class="caixa">Dados pessoais · Endereço · Minha contribuição</div></div>')+'<p class="legenda">As informações religiosas e o status do cadastro são mantidos pela direção da Casa.</p>';} },
    { t:'Como voltar ao site e como sair', html:function(){return '<p class="grande">Voltando ao site, o menu do alto ganha as opções <b>Perfil</b> (seus dados) e <b>Sair</b>. Conteúdos exclusivos dos filhos, quando a direção liberar, aparecem ali também.</p>'+navegador(SITE, pcMenu('Sair', true)+siteCorpoPC())+'<p class="legenda">Ao terminar, clique em <b>Sair</b>, principalmente em computador de outra pessoa.</p>';},
      aviso:'Para entrar de novo outro dia, repita: <b>Filhos</b> › número › código.' }
  ];

  /* ---------- telas ---------- */
  var app = document.getElementById('app');
  var modo=null, i=0;

  function inicio(){
    modo=null; i=0;
    app.innerHTML =
      '<section class="card">'+
      '<h1>Bem-vindo ao Tutorial passo a passo do site do Batuara</h1>'+
      '<div class="destaque">Filhos acessam a <b>área restrita</b> usando o <b>número de celular que consta no seu cadastro</b>. Filhos novos podem ainda não ter o número informado; nesse caso, entrar em contato com a <b>direção</b>.</div>'+
      '<h2 style="margin-top:1.3rem">Você deseja conhecer a versão para…</h2>'+
      '<div class="escolhas">'+
        '<button class="opcao" data-modo="mobile"><span class="ico" aria-hidden="true">📱</span><strong>Celular</strong><span class="sub">Com o menu das 3 listrinhas (hambúrguer)</span></button>'+
        '<button class="opcao" data-modo="desk"><span class="ico" aria-hidden="true">💻</span><strong>Computador</strong><span class="sub">Com o menu aberto no alto da tela</span></button>'+
      '</div>'+
      '</section>'+ faq();
    bind();
  }

  function passos(){ return modo==='mobile'?MOBILE:DESK; }

  function passo(){
    var p=passos()[i], total=passos().length, ult=(i===total-1);
    var barras=''; for(var k=0;k<total;k++) barras+='<i class="'+(k<=i?'on':'')+'"></i>';
    app.innerHTML =
      '<section class="card">'+
      '<p style="margin:0;color:var(--txt2)">Versão para <b>'+(modo==='mobile'?'celular 📱':'computador 💻')+'</b> · <button class="btn link" data-acao="trocar">trocar</button></p>'+
      '<div class="progresso" aria-hidden="true">'+barras+'</div>'+
      '<span class="passo-n">Passo '+(i+1)+' de '+total+'</span>'+
      '<h2 style="margin-top:.6rem">'+p.t+'</h2>'+
      p.html()+
      (p.aviso?'<div class="destaque">'+p.aviso+'</div>':'')+
      (p.dica?'<div class="dica">'+p.dica+'</div>':'')+
      '<div class="nav">'+
        (i>0?'<button class="btn sec" data-acao="ant">‹ Voltar</button>':'<button class="btn sec" data-acao="inicio">‹ Início</button>')+
        (ult?'<button class="btn prim" data-acao="fim">Concluir ✓</button>':'<button class="btn prim" data-acao="prox">Próximo ›</button>')+
      '</div></section>';
    bind(); window.scrollTo({top:0});
  }

  function fim(){
    app.innerHTML =
      '<section class="card"><h1>Tudo certo! 🎉</h1>'+
      '<div class="ok grande">Agora você já sabe usar o site da Casa Batuara e entrar na sua área com o número do celular.</div>'+
      '<p class="grande">Resumo rápido:</p>'+
      (modo==='mobile'
        ? '<ol class="lista grande"><li>Abra <b>'+SITE+'</b>.</li><li>Toque nas <b>3 listrinhas</b> (canto de cima, à direita).</li><li>Toque em <b>Filhos</b>.</li><li>Digite o <b>celular</b> e toque em <b>Receber código no WhatsApp</b>.</li><li>Digite o <b>código</b> e toque em <b>Entrar com código</b>.</li></ol>'
        : '<ol class="lista grande"><li>Abra <b>'+SITE+'</b>.</li><li>Clique em <b>Filhos</b> no menu do alto.</li><li>Digite o <b>celular</b> e clique em <b>Receber código no WhatsApp</b>.</li><li>Digite o <b>código</b> e clique em <b>Entrar com código</b>.</li></ol>')+
      '<div class="nav"><button class="btn prim" data-modo="'+(modo==='mobile'?'desk':'mobile')+'">Ver também a versão para '+(modo==='mobile'?'computador 💻':'celular 📱')+'</button><button class="btn sec" data-acao="inicio" style="flex:1 1 140px">Início</button></div></section>'+faq();
    bind(); window.scrollTo({top:0});
  }

  function faq(){
    return '<section class="card faq"><h2>Dúvidas comuns</h2>'+
      '<details><summary>O código não chegou no WhatsApp</summary><p>Espere 1 minuto e confira se o número digitado é o mesmo do seu WhatsApp (com DDD). Veja também se o WhatsApp está com internet. Pode pedir um código novo tocando em <b>Trocar celular</b> e repetindo. Se ainda assim não chegar, fale com a direção para conferir o seu cadastro.</p></details>'+
      '<details><summary>Apareceu “Se o número estiver cadastrado…”, mas nada chega</summary><p>Por segurança, o site responde isso para qualquer número. Se o seu número não estiver no cadastro da Casa, o código não é enviado. Peça à direção para conferir ou atualizar o seu número.</p></details>'+
      '<details><summary>“Código inválido ou expirado”</summary><p>O código vale <b>10 minutos</b> e permite <b>5 tentativas</b>. Se passou do tempo ou errou muitas vezes, peça um código novo (<b>Trocar celular</b> › <b>Receber código no WhatsApp</b>).</p></details>'+
      '<details><summary>Não acho a opção “Filhos”</summary><p>No celular, abra o menu das <b>3 listrinhas</b> (canto superior direito) e role até o <b>final da lista</b>. Se você já estiver dentro da sua área, a opção <b>Filhos</b> some e aparecem <b>Perfil</b> e <b>Sair</b>.</p></details>'+
      '<details><summary>Troquei de número de celular</summary><p>Avise a direção da Casa para atualizar o número no seu cadastro. Sem isso, o código continuará sendo enviado para o número antigo ou não será enviado.</p></details>'+
      '<details><summary>Posso entrar usando um aparelho emprestado?</summary><p>O código só é enviado para o <b>WhatsApp do número cadastrado como filho da Casa</b>, e não para qualquer número digitado. Por isso, só dá para entrar em um aparelho emprestado se o <b>seu chip (ou e-SIM) e o seu WhatsApp</b> estiverem nele. Em um computador de outra pessoa, você ainda precisa do seu celular para receber o código. Ao terminar, abra o menu e toque em <b>Sair</b>, para que ninguém mais entre no seu cadastro.</p></details>'+
      '<details><summary>Posso passar o código para outra pessoa ajudar?</summary><p>Não. O código é pessoal. A Casa <b>nunca</b> pede o seu código por mensagem ou ligação.</p></details>'+
      '</section><p class="rodape">Casa de Caridade Caboclo Batuara · Guarulhos/SP · '+SITE+'</p>';
  }

  function bind(){
    Array.prototype.forEach.call(app.querySelectorAll('[data-modo]'),function(b){
      b.addEventListener('click',function(){ modo=b.getAttribute('data-modo'); i=0; passo(); });
    });
    Array.prototype.forEach.call(app.querySelectorAll('[data-acao]'),function(b){
      b.addEventListener('click',function(){
        var a=b.getAttribute('data-acao');
        if(a==='prox'){i++;passo();} else if(a==='ant'){i--;passo();}
        else if(a==='fim'){fim();} else {inicio();}
      });
    });
  }
  /* atalho: TutorialBatuara.html#celular-4  ou  #computador-2 */
  var m=/^#(celular|computador)(?:-(\d+))?$/.exec(location.hash||'');
  if(m){ modo=(m[1]==='celular')?'mobile':'desk'; i=Math.max(0,Math.min(passos().length-1,(parseInt(m[2],10)||1)-1)); passo(); }
  else { inicio(); }
})();
</script>
</body>
</html>
